name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        shell: bash
        # The nvidia-* wheels are ~700MB of CUDA runtime that only matter for GPU
        # inference. main._inject_nvidia_dlls() no-ops when they are absent, so the
        # suite runs fine without them — skip them to keep CI fast.
        run: |
          python -m pip install --upgrade pip
          grep -v '^nvidia-' requirements.txt > requirements-ci.txt
          pip install -r requirements-ci.txt

      - name: Run tests
        shell: bash
        # The four model-gated test files (Breeze / Qwen3 / punctuation / VAD) skip
        # automatically here: models/ is gitignored, so a fresh checkout has none.
        run: python -m pytest -q
