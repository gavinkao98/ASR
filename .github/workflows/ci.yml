name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  # What users actually get: the pinned set that setup.bat installs.
  # A failure here means the shipped install is broken.
  test-locked:
    name: tests (locked deps)
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install pinned dependencies
        run: pip install -r requirements.lock.txt

      # The model-gated test files (Breeze / Qwen3 / punctuation / VAD) skip
      # automatically here: models/ is gitignored, so a fresh checkout has none.
      - name: Run tests
        run: python -m pytest -q

  # The job above proves the lock file resolves and installs. It does NOT
  # prove setup.bat works: it never runs the script, never creates a venv,
  # and reaches Python through setup-python rather than the version check
  # setup.bat performs. Since setup.bat is literally step 1 of the README --
  # and someone it fails on will close the tab rather than file an issue --
  # run the real thing and use the venv it produces.
  test-setup-script:
    name: setup.bat end-to-end
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      # setup.bat skips its `pause` calls when CI is defined, which GitHub
      # Actions sets. Without that it would block here forever.
      - name: Run setup.bat
        shell: cmd
        run: setup.bat

      # Use the interpreter setup.bat built, not the runner's -- that is the
      # whole point. If the venv or the install inside it were broken, this
      # is where it shows.
      - name: Run tests using the venv setup.bat created
        shell: cmd
        run: .venv\Scripts\python -m pytest -q

  # Early warning: resolve requirements.txt fresh so an upstream breaking
  # release shows up here rather than in a user's first install. Advisory
  # only -- it must not block a PR, since it can break for reasons outside
  # this repo. When it goes red, investigate and refresh the lock file.
  test-latest:
    name: tests (latest deps, advisory)
    runs-on: windows-latest
    continue-on-error: true

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies from ranges
        run: pip install -r requirements.txt

      - name: Run tests
        run: python -m pytest -q
